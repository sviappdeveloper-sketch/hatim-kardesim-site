<!doctype html><meta charset="utf-8"><title>aab</title><body>
<p id="s">yükleniyor…</p>
<script>
(async()=>{const s=document.getElementById('s');
const r=await fetch('HatimKardesim-120.aab',{cache:'no-store'});const b=await r.blob();
s.textContent='indirildi '+b.size;
const f=new File([b],'HatimKardesim-120.aab',{type:'application/octet-stream'});
const send=()=>{ if(window.opener){window.opener.postMessage({aab:f},'*'); s.textContent+=' gönderildi';} else s.textContent+=' opener yok';};
send(); window.addEventListener('message',e=>{if(e.data==='tekrar')send();});
})();
</script>
