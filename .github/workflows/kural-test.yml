name: Firestore kural testi
on:
  push:
    paths: ['kural-test/**', '.github/workflows/kural-test.yml']
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: kural-test } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install --no-audit --no-fund && npm install -g firebase-tools@13
      - run: firebase emulators:exec --only firestore --project hatim-test "node test.mjs"
